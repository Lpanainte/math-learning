8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}.panel{background:var(--card);padding:23px;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.hero{background:linear-gradient(120deg,#172943,#293d70 68%,#5267a0);color:white;overflow:hidden;position:relative}.hero:after{content:'∫';position:absolute;font:260px Georgia,serif;right:22px;bottom:-133px;opacity:.08;pointer-events:none}.hero h2{font:normal 34px Georgia,serif;max-width:620px;margin:10px 0}.hero p{color:#d2dff9;max-width:600px}.hero .btn{position:relative;z-index:1}.btn{border:1px solid var(--blue);background:var(--blue);color:white;border-radius:11px;padding:11px 16px;font-size:13px;font-weight:750}.btn:hover{filter:brightness(.94)}.btn.secondary{background:white;color:var(--blue);border-color:#d1d9ee}.btn.ghost{background:transparent;color:var(--blue);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.btnline{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.metric{font-size:34px;font-weight:800;letter-spacing:-1px}.muted{color:var(--sub);font-size:13px}.tag{border-radius:999px;background:#edf1ff;color:#4859a0;padding:7px 11px;font-size:11px;font-weight:750;display:inline-block}.progress{height:9px;border-radius:20px;background:#e9edf6;overflow:hidden;margin:11px 0}.progress span{display:block;height:100%;background:var(--blue);transition:width .2s}.topic{border-bottom:1px solid var(--line);padding:15px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}.topic:last-child{border:0}.topic strong{display:block;font-size:14px}.topic small{display:block;margin-top:4px;color:var(--sub)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bcc7df;margin-right:8px}.dot.done{background:#2f9e72}.explain{background:#eef4ff;border-left:3px solid var(--blue);border-radius:9px;padding:15px 17px;line-height:1.65;font-size:13px;color:#3c5279}.explain.good{background:#eaf7f0;border-color:#42a279;color:#275b46}.explain.bad{background:#fff0f2;border-color:#bd5365;color:#743548}.formula{border-radius:12px;background:#eff2fb;padding:16px 18px;font:16px/1.75 ui-monospace,Consolas,monospace;color:#263d75;overflow-x:auto;white-space:pre-wrap;word-break:break-word}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lessoncard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;text-align:left;transition:.2s}.lessoncard:hover{transform:translateY(-2px);border-color:#b3c4ed}.lessoncard strong{display:block;font-size:15px;margin:9px 0}.lessoncard small{color:var(--sub)}.pill{font-size:11px;background:#edf1ff;border-radius:20px;padding:6px 9px;font-weight:700;color:#4d61ac}.tabbar{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab{border:1px solid var(--line);padding:10px 13px;border-radius:10px;background:white;color:#51647e;font-weight:700;white-space:nowrap}.tab.on{background:var(--navy);border-color:var(--navy);color:white}.steps{list-style:none;padding:0;margin:15px 0}.steps li{padding:14px 16px;border-left:3px solid #c2ccea;margin-bottom:10px;background:#f8faff;border-radius:0 10px 10px 0;line-height:1.65;font-size:14px}.steps li strong{display:block;color:#3453a0;margin-bottom:4px}.slider{width:100%;accent-color:var(--blue);margin:12px 0 19px}.control label{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.control b{color:var(--blue)}.graph{background:#fbfcff;border:1px solid var(--line);border-radius:13px;display:block;width:100%;height:auto}.question{font-weight:750;font-size:21px;line-height:1.45;margin:20px 0}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{background:white;color:var(--ink);border:1px solid var(--line);padding:15px;text-align:left;border-radius:12px;font-weight:650}.answer:hover{border-color:#a7b9ef}.answer.right{background:#e9f8ef;border-color:#4da87e}.answer.wrong{background:#fff0f2;border-color:#d57283}.answer:disabled{cursor:default}.input{padding:12px 14px;border:1px solid #ccd5e7;border-radius:10px;max-width:260px;width:100%}.mini-table{width:100%;border-collapse:collapse;font-size:13px}.mini-table th,.mini-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.mini-table th{color:#50617e}.footer{color:#8792a8;font-size:11px;line-height:1.7;margin-top:28px}.mobile{display:none}.hidden{display:none!important}@media(max-width:950px){.layout{display:block}.side{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);z-index:15;justify-content:space-around;padding:8px 3px max(10px,env(safe-area-inset-bottom))}.mobile button{background:none;border:0;color:#bdc9e2;display:grid;gap:3px;justify-items:center;font-size:10px;padding:5px}.mobile button span{font-size:20px}.mobile button.on{color:white;font-weight:800}.main{padding-bottom:100px}}@media(max-width:680px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}.s3{grid-column:span 6}.cards,.answers{grid-template-columns:1fr}.panel{padding:17px}.hero h2{font-size:29px}h1{font-size:33px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="logo">∂</div><div><strong>Mike's Math Lab</strong><small>Applied Mathematics · Chapter 1</small></div></div><div><div class="side-label">STUDY SPACE</div><div id="nav"></div></div><div class="side-note"><strong>Mike's study rule</strong><br>Understand → Try → Check → Explain → Repeat.<br><br>Your progress stays in this browser.</div></aside><main class="main" id="main"></main></div><nav id="mobile" class="mobile"></nav>
<script>
'use strict';
const KEY='mikes_math_lab_ode_ch1_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{state={}};state.done=state.done||{};state.mistakes=state.mistakes||{};state.attempts=state.attempts||0;state.correct=state.correct||0;
let view='home',lesson=0,quizIndex=0,quizPool=[],quizAnswered=false,quizSelection=null,quizMode='all',graphMode='growth';
const topics=[
 {name:'What is an ODE?',sub:'Derivative, slope, initial condition',pages:'3–4',formula:"dy/dt = f(t, y),   y(t₀) = y₀",intro:'A differential equation gives a rule for how something changes. The unknown is a whole function, not just a number.',analogy:'Think of a GPS that tells you the speed and direction at each moment. The differential equation is the movement rule; the initial condition tells you where you started.',steps:[['Recognize the derivative','dy/dt is the instantaneous slope of y versus t. A positive slope means rising; negative means falling.'],['Read the rule','In dy/dt = 2y, the slope equals twice the current value. At y = 3, the slope is 6.'],['Use the initial condition','y(0)=3 says the curve passes through (0, 3). Without it, many curves can obey the same rule.'],['Check the solution','For y(t)=3e^(2t), the derivative is 6e^(2t)=2y(t), and y(0)=3.']],takeaway:'Derivative = rate of change. Initial value = starting point. Solution = the full curve.'},
 {name:'Separable Equations',sub:'Separate, integrate, solve, check',pages:'4–6, 9–10',formula:'dy/dx = g(x)h(y)  →  dy/h(y) = g(x) dx',intro:'Separation of variables works when the right-hand side can be written as a product of a function of x and a function of y.',analogy:'Put all the y-related pieces on the left, all the x-related pieces on the right, then integrate both sides.',steps:[['Recognize the structure','For dy/dx=2xy, write dy/y=2x dx, where y ≠ 0. Also check y=0 separately as a possible solution.'],['Integrate both sides','∫(1/y)dy = ∫2x dx  →  ln|y|=x²+C.'],['Solve for y','y=Ae^(x²). Here A is a real constant; the zero solution is included when A=0.'],['Apply an initial condition','Given y(0)=3, we get A=3, so y=3e^(x²).'],['Check validity','Differentiate your proposed solution and verify the ODE and initial value. Watch for division by zero and singularities.']],takeaway:'Separate → integrate → use the initial value → verify → find the interval.'},
 {name:'Uniqueness & Lipschitz',sub:'When can we trust one solution?',pages:'6–7',formula:'|f(t,y₁) − f(t,y₂)| ≤ L|y₁ − y₂|',intro:'Before approximating a solution, we should ask whether the initial-value problem has a locally unique solution.',analogy:'Two routes starting from exactly the same location cannot branch apart if the rate-of-change rule is well-behaved in the required sense.',steps:[['Start with the initial-value problem','We know dy/dt=f(t,y) and y(t₀)=y₀.'],['Check continuity','The standard existence-and-uniqueness theorem requires f to be continuous locally near the starting point.'],['Check Lipschitz in y','If f is locally Lipschitz with respect to y (for example, ∂f/∂y is continuous near the point), the initial-value solution is locally unique.'],['Understand the limitation','Failure of the Lipschitz test does NOT prove non-uniqueness. It only removes this particular guarantee.'],['See the counterexample','For y′=y^(1/3), y(0)=0, both y=0 and a solution that leaves zero after a delay can satisfy the same initial value.']],takeaway:'Continuity + local Lipschitz in y ⇒ local existence and uniqueness. The condition is sufficient, not necessary.'},
 {name:'Euler Method',sub:'Numerical slopes, one step at a time',pages:'7–9, 10–11',formula:'yₙ₊₁ = yₙ + h · f(tₙ,yₙ)',intro:'Euler approximates a solution by repeatedly moving along the tangent line instead of following the exact curved path.',analogy:'Take a small step in the direction of the slope, stop, measure the new slope, then take the next step.',steps:[['Write down the starting point','For y′=y−t²+1 and y(0)=0.5: t₀=0, y₀=0.5.'],['Choose the step size','Use h=0.2. The next t value is t₁=0.2.'],['Calculate the slope','f(0,0.5)=0.5−0+1=1.5.'],['Apply Euler','y₁=0.5+0.2(1.5)=0.8.'],['Repeat with the NEW point','f(0.2,0.8)=0.8−0.04+1=1.76, so y₂=0.8+0.2(1.76)=1.152.']],takeaway:'New y = old y + step size × current slope. Smaller h usually reduces error, but costs more steps.'},
 {name:'Heun Method',sub:'Predict with Euler, then correct',pages:'8–10',formula:'k₁=f(tₙ,yₙ)\ny*=yₙ+h·k₁\nk₂=f(tₙ+h,y*)\nyₙ₊₁=yₙ+(h/2)(k₁+k₂)',intro:'Heun improves Euler by averaging the slope at the beginning with a predicted slope at the end.',analogy:'Instead of estimating a car journey only from your starting speed, estimate the ending speed too and use the average.',steps:[['First slope','For y′=y−t²+1, y(0)=0.5, h=0.2: k₁=f(0,0.5)=1.5.'],['Euler prediction','y*=0.5+0.2×1.5=0.8.'],['Second slope','k₂=f(0.2,0.8)=0.8−0.04+1=1.76.'],['Average the slopes','(k₁+k₂)/2 = (1.5+1.76)/2=1.63.'],['Correct the prediction','y₁=0.5+0.2×1.63=0.826. Exact: approximately 0.8293.']],takeaway:'Euler uses one slope; Heun uses two. Both are numerical approximations.'},
 {name:'Worked Examples & Practice',sub:'Apply the full chapter to exam-style problems',pages:'5–6, 9–12',formula:'Identify → Set up → Solve → Verify',intro:'Use the same thinking process on every problem. Recognize what is being asked before choosing a formula.',analogy:'The goal is to recognize the structure, not memorize isolated calculations.',steps:[['Example A: separable','Solve y′=6xy², y(1)=1/125. Separation gives y^(-2)dy=6x dx.'],['Integrate','−1/y=3x²+C. Since y(1)=1/125, −125=3+C, so C=−128.'],['Write the explicit answer','y(x)=1/(128−3x²).'],['Find the maximal interval','The denominator vanishes at ±√(128/3), so the interval containing x=1 is (−√(128/3), √(128/3)).'],['Example B: trigonometric','For y′=x cos(x²)/y, y(0)=2, integration gives y²=sin(x²)+4; take the positive root.']],takeaway:'Always use the initial value, differentiate to verify, and check the valid interval.'}
];
const questions=[
 ['01',0,'What does dy/dt represent?',['The rate of change of y','The initial value','The numerical step size','The integral constant'],0,'It is the instantaneous slope. It tells you how fast y changes with t.'],
 ['02',0,'For y′=2y, what is the slope when y=3?',['2','3','6','9'],2,'Substitute the CURRENT value: 2×3 = 6.'],
 ['03',0,'Why do we need y(0)=3 in addition to y′=2y?',['To select one solution curve','To make t equal to 3','To change the derivative','To eliminate t'],0,'The differential rule describes a family of curves; the initial condition picks a member.'],
 ['04',1,'Is y′=x(y+1) separable?',['Yes','No','Only if x=0','Only if y=1'],0,'It factors into a function of x times a function of y. dy/(y+1)=x dx where y≠−1; separately check y=−1.'],
 ['05',1,'Solve y′=2xy with y(0)=3.',['y=3e^(x²)','y=3e^(2x)','y=2xe³','y=3+x²'],0,'Separate dy/y=2x dx; integrate ln|y|=x²+C. Initial value yields y=3e^(x²).'],
 ['06',1,'Which is the next correct step for y′=6xy²?',['y⁻² dy = 6x dx','y² dy = 6x dx','dy = 6y dx','y dy = x² dx'],0,'Divide by y² (on nonzero solutions) and multiply by dx.'],
 ['07',1,'For y=1/(128−3x²) with y(1)=1/125, which maximal interval contains x=1?',['(−√(128/3), √(128/3))','All real numbers','(1,∞)','(−∞,1)'],0,'Avoid both denominator zeros; choose the connected interval containing x=1.'],
 ['08',2,'What does the local Lipschitz condition in y help guarantee (with the other theorem assumptions)?',['Local uniqueness of the IVP solution','Every ODE has a simple formula','Euler always produces exact answers','All solutions are global'],0,'With continuity, local Lipschitz in y yields a unique local solution via Picard–Lindelöf.'],
 ['09',2,'If a function fails a Lipschitz test, what can you conclude?',['Uniqueness is not guaranteed by that test','There must be infinitely many solutions','There is never a solution','Euler is impossible to compute'],0,'A sufficient test failing does not prove that uniqueness fails.'],
 ['10',2,'Does y′=y^(1/3), y(0)=0 have a unique solution?',['No','Yes','Only for negative t','Only with Euler'],0,'There are multiple solutions, including y=0 and solutions that remain at zero before departing.'],
 ['11',3,'Euler: y′=t+y, y(0)=1, h=0.1. Find y₁.',['1.1','1.2','0.9','2'],0,'y₁=y₀+h f(0,1)=1+0.1(1)=1.1.'],
 ['12',3,'Using the previous Euler example, what is y₂?',['1.22','1.21','1.1','1.32'],0,'At t₁=0.1, y₁=1.1, slope=0.1+1.1=1.2; y₂=1.1+0.1×1.2=1.22.'],
 ['13',3,'Euler for y′=y−t²+1, y(0)=0.5, h=0.2: y₁=?',['0.8','0.826','1.5','1.152'],0,'f(0,0.5)=1.5. Add h×slope: 0.5+0.2×1.5=0.8.'],
 ['14',3,'Why might a smaller Euler step improve accuracy?',['It reduces the distance spent following a straight tangent','It makes the true curve straight','It guarantees zero error','It changes the ODE'],0,'Shorter steps reduce the approximation made by each tangent segment, under suitable conditions.'],
 ['15',4,'Heun: if k₁=1.5, k₂=1.76, y₀=0.5, h=0.2, what is y₁?',['0.826','0.8','1.63','0.852'],0,'y₁=0.5+(0.2/2)(1.5+1.76)=0.826.'],
 ['16',4,'Which method uses a predicted endpoint slope?',['Heun','Basic Euler','Separation only','The initial condition'],0,'Heun predicts a point with Euler, computes another slope there, and averages.'],
 ['17',4,'In the chapter example at t=0.2, which is closest to the exact value 0.8293?',['Heun: 0.826','Euler: 0.8','Both equal','Neither can be compared'],0,'Heun error ≈0.0033 versus Euler error ≈0.0293.'],
 ['18',5,'For y′=6xy², y(1)=1/125, find the integration constant in −1/y=3x²+C.',['−128','128','−125','3'],0,'At x=1, −1/y=−125, so −125=3+C and C=−128.'],
 ['19',5,'For y′=x cos(x²)/y, y(0)=2, what is y(x)?',['√(4+sin(x²))','4+sin(x)','√(2+cos(x²))','−√(4+sin(x²))'],0,'Integrate y dy=x cos(x²)dx; get y²=4+sin(x²). y(0)=2 chooses the positive branch.'],
 ['20',5,'What must you check after finding an explicit ODE solution?',['ODE, initial condition, and valid interval','Only the last digit','Only the integral sign','Only the graph color'],0,'Differentiate, substitute, check the initial value, and identify singularities/domain restrictions.']
];
const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const percent=()=>Math.round(100*topics.filter((_,i)=>state.done[i]).length/topics.length);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navItems=[['home','⌂','Dashboard'],['lessons','▤','Lessons'],['visual','∿','Visual Lab'],['practice','✎','Practice & Quiz'],['mistakes','◎','Review Mistakes']];
function navigate(name){view=name;render();window.scrollTo({top:0,behavior:'smooth'})}function chooseLesson(i){lesson=i;navigate('lesson')}function startQuiz(mode='all'){quizMode=mode;quizPool=questions.filter(q=>mode==='all'||(mode==='mistakes'&&state.mistakes[q[0]])||(String(q[1])===String(mode)));if(!quizPool.length)quizPool=questions.slice();quizIndex=0;quizAnswered=false;quizSelection=null;navigate('practice')}
function renderNav(){const html=navItems.map(([id,ic,label])=>`<button class="navbtn ${view===id||(view==='lesson'&&id==='lessons')?'on':''}" onclick="navigate('${id}')"><span class="ic">${ic}</span>${label}</button>`).join('');$('nav').innerHTML=html;$('mobile').innerHTML=navItems.map(([id,ic,label])=>`<button class="${view===id||(view==='lesson'&&id==='lessons')?'on':''}" onclick="navigate('${id}')"><span>${ic}</span>${label.replace(' & Quiz','')}</button>`).join('')}
function head(title,sub,eyebrow='MIKE’S STUDY SPACE'){return `<div class="heading"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>`}
function home(){return `${head('Make difficult maths feel simple.','A structured study companion for first-order ordinary differential equations. Built around your Chapter 1 course notes.')}<div class="grid"><section class="panel hero s8"><span class="eyebrow" style="color:#bdcffb">WELCOME BACK, MIKE</span><h2>Understand the why.<br>Master the how.</h2><p>Learn the idea, move the graph, solve a problem yourself, and review exactly what you missed.</p><div class="btnline"><button class="btn" style="background:white;color:#253d74;border-color:white" onclick="chooseLesson(${topics.findIndex((_,i)=>!state.done[i])<0?0:topics.findIndex((_,i)=>!state.done[i])})">Continue learning</button><button class="btn" style="background:transparent;border-color:#91a7d6" onclick="startQuiz()">Test my knowledge</button></div></section><section class="panel s4"><div class="muted">CHAPTER COMPLETION</div><div class="metric">${percent()}%</div><div class="progress"><span style="width:${percent()}%"></span></div><p class="muted">${topics.filter((_,i)=>state.done[i]).length} of ${topics.length} lessons marked complete</p><div style="height:14px"></div><div class="muted">QUIZ ACCURACY</div><div class="metric">${state.attempts?Math.round(state.correct/state.attempts*100)+'%':'—'}</div><p class="muted">${state.correct} correct / ${state.attempts} attempts</p></section><section class="panel s8"><h2>Your learning path</h2>${topics.map((t,i)=>`<div class="topic"><div><strong><span class="dot ${state.done[i]?'done':''}"></span>${i+1}. ${t.name}</strong><small style="margin-left:19px">${t.sub}</small></div><button class="btn secondary" onclick="chooseLesson(${i})">${state.done[i]?'Review':'Study'} →</button></div>`).join('')}</section><section class="panel s4"><h2>How to learn effectively</h2><div class="explain">1. Read a concept and explain it in your own words.<br>2. Use the interactive plot to see what changes.<br>3. Solve without looking at the solution.<br>4. Repeat missed questions later.</div><div style="height:20px"></div><h3>Course coverage</h3><p class="muted">First-order ODEs · separation · uniqueness · Euler · Heun · solved examples · exercises.</p><button class="btn secondary" onclick="navigate('visual')">Open interactive graphs</button></section></div>${footer()}`}
function lessons(){return head('Learning path','Six connected lessons in the same sequence as the uploaded course notes. Each lesson explains the idea, the reasoning, and a worked example.')+`<div class="cards">${topics.map((t,i)=>`<button class="lessoncard" onclick="chooseLesson(${i})"><span class="pill">LESSON ${i+1} · PDF pp. ${t.pages}</span><strong>${t.name} ${state.done[i]?'✓':''}</strong><small>${t.sub}</small><div class="btnline"><span class="muted">Open lesson →</span></div></button>`).join('')}</div>`+footer()}
function lessonPage(){let t=topics[lesson];return head(t.name,t.sub,`LESSON ${lesson+1} OF ${topics.length} · COURSE NOTES, PAGES ${t.pages}`)+`<div class="grid"><section class="panel s8"><h2>Start with the big idea</h2><p>${t.intro}</p><div class="formula">${esc(t.formula)}</div><h3>Think about it this way</h3><div class="explain">${t.analogy}</div><div style="height:24px"></div><h2>Derivation, step by step</h2><ol class="steps">${t.steps.map((s,i)=>`<li><strong>STEP ${i+1} · ${s[0]}</strong>${esc(s[1])}</li>`).join('')}</ol><div class="explain good"><strong>What you must remember:</strong> ${t.takeaway}</div><div class="btnline"><button class="btn" onclick="markDone(${lesson})">${state.done[lesson]?'✓ Completed':'Mark lesson complete'}</button><button class="btn secondary" onclick="startQuiz('${lesson}')">Practice this lesson</button>${lesson<topics.length-1?`<button class="btn ghost" onclick="chooseLesson(${lesson+1})">Next lesson →</button>`:''}</div></section><aside class="panel s4"><h3>Quick check</h3><p>Can you explain this concept without looking at the formula?</p><div class="explain">Try saying: “This method works because…”</div><div style="height:18px"></div><h3>Relevant visual tool</h3><p>${lesson===3||lesson===4?'Use the numerical solver to compare Euler and Heun.':'Use the graph to connect the equation to a real curve.'}</p><button class="btn secondary" onclick="setGraph('${lesson===3||lesson===4?'numerical':lesson===2?'uniqueness':'growth'}')">Explore the graph →</button><div style="height:24px"></div><h3>Source</h3><p class="muted">Based on Chapter 1 of the supplied Applied Mathematics notes. Additional teaching explanations and questions were written specifically for this site.</p></aside></div>`+footer()}
function markDone(i){state.done[i]=!state.done[i];save();render()}function setGraph(m){graphMode=m;navigate('visual')}
function visual(){return head('Interactive Visual Lab','Move the sliders and watch the mathematics react. Read the interpretation below each chart.')+`<div class="tabbar"><button class="tab ${graphMode==='growth'?'on':''}" onclick="setGraph('growth')">Growth & decay</button><button class="tab ${graphMode==='numerical'?'on':''}" onclick="setGraph('numerical')">Euler vs Heun</button><button class="tab ${graphMode==='slope'?'on':''}" onclick="setGraph('slope')">Slope & initial value</button><button class="tab ${graphMode==='uniqueness'?'on':''}" onclick="setGraph('uniqueness')">Uniqueness</button></div><div id="visualContents"></div>`}
function control(id,label,min,max,step,val){return `<div class="control"><label for="${id}">${label}<b id="v_${id}">${val}</b></label><input class="slider" id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="updateChart()"></div>`}
function graphLayout(title,description,controls,extra=''){return `<div class="grid"><section class="panel s8"><h2>${title}</h2><p>${description}</p><svg id="plot" class="graph" viewBox="0 0 700 360" role="img" aria-label="Interactive mathematical graph"></svg><div id="chartReadout" class="explain" style="margin-top:15px"></div>${extra}</section><section class="panel s4"><h3>Experiment</h3>${controls}<div class="explain"><strong>Try this:</strong> Change just one parameter at a time. Predict what should happen before moving the slider.</div></section></div>`}
function renderGraph(){let el=$('visualContents');if(!el)return;if(graphMode==='growth')el.innerHTML=graphLayout('How does dy/dt = k·y behave?','The solution is y(t)=y₀e^(kt). Watch what happens when k changes sign.',control('k','Growth rate k',-2,2,0.1,0.6)+control('y0','Initial value y₀',0.5,5,0.5,2));else if(graphMode==='numerical')el.innerHTML=graphLayout('Euler vs Heun vs exact solution','Course example: y′=y−t²+1, y(0)=0.5, across [0,1].',control('h','Step size h',0.05,0.5,0.05,0.2)+`<button class="btn secondary" onclick="showTable()">Show numerical step table</button>`,`<div id="stepTable"></div>`);else if(graphMode==='slope')el.innerHTML=graphLayout('Same equation. Different starting points.','The ODE y′=k·y sets the slope. The initial value picks which curve you follow.',control('sk','Rate k',-1.5,1.5,0.1,0.5)+control('sy','Starting value y(0)',0.5,5,0.5,2));else el.innerHTML=graphLayout('What happens without uniqueness?','For y′=y^(1/3), y(0)=0, multiple curves may leave zero at different times.',control('delay','Departure time a',0,3,0.25,1));updateChart()}
const val=id=>Number($(id).value);const round=(n,d=3)=>Number(n.toFixed(d));
function updateChart(){let mode=graphMode,svg=$('plot');if(!svg)return;let series=[],tmax=mode==='numerical'?1:mode==='uniqueness'?4:3, ymin=0,ymax=10,description='';if(mode==='growth'){let k=val('k'),y0=val('y0');series=[{name:'y(t)',color:'#5368d0',pts:Array.from({length:151},(_,i)=>{let t=tmax*i/150;return[t,y0*Math.exp(k*t)]})}];description=`k = ${k.toFixed(1)}; y(0) = ${y0.toFixed(1)}. ${k>0?'Positive k → exponential growth.':k<0?'Negative k → exponential decay.':'k = 0 → constant solution.'} At t=1, y(1) ≈ ${(y0*Math.exp(k)).toFixed(3)}.`;ymax=Math.max(3,Math.max(...series[0].pts.map(p=>p[1]))*1.15)}else if(mode==='slope'){let k=val('sk'),y=val('sy');series=[{name:'Your initial value',color:'#5368d0',pts:Array.from({length:151},(_,i)=>{let t=3*i/150;return[t,y*Math.exp(k*t)]})},{name:'Other initial value',color:'#e3935a',pts:Array.from({length:151},(_,i)=>{let t=3*i/150;return[t,1*Math.exp(k*t)]})}];description=`At t=0, the slope of your blue curve is k·y₀ = ${(k*y).toFixed(2)}. Same rate law; different initial values select different curves.`;ymax=Math.max(3,...series.flatMap(s=>s.pts.map(p=>p[1])))*1.12}else if(mode==='uniqueness'){let a=val('delay');let pos=t=>t<=a?0:Math.pow((2/3)*(t-a),1.5);series=[{name:'Zero solution',color:'#e3935a',pts:[[0,0],[4,0]]},{name:'Delayed departure',color:'#5368d0',pts:Array.from({length:151},(_,i)=>{let t=4*i/150;return[t,pos(t)]})}];ymax=5;description=`Both curves satisfy y′=y^(1/3) and y(0)=0. The blue solution stays at zero until t=${a.toFixed(2)}, then leaves. That shows non-uniqueness.`}else{let h=val('h');let N=Math.round(1/h);h=1/N;let f=(t,y)=>y-t*t+1,ye=0.5,yh=0.5,ep=[[0,ye]],hp=[[0,yh]];for(let i=0;i<N;i++){let t=i*h,k1=f(t,yh),yp=yh+h*k1,k2=f(t+h,yp);yh+=h*(k1+k2)/2;ye+=h*f(t,ye);ep.push([(i+1)*h,ye]);hp.push([(i+1)*h,yh])}let exact=t=>(t+1)**2-0.5*Math.exp(t);series=[{name:'Exact',color:'#222f4b',pts:Array.from({length:151},(_,i)=>{let t=i/150;return[t,exact(t)]})},{name:'Euler',color:'#e3935a',pts:ep},{name:'Heun',color:'#5368d0',pts:hp}];ymax=3;description=`${N} steps; actual h=${h.toFixed(4)}. At t=1: exact=${exact(1).toFixed(5)}, Euler=${ye.toFixed(5)} (error ${Math.abs(ye-exact(1)).toFixed(5)}), Heun=${yh.toFixed(5)} (error ${Math.abs(yh-exact(1)).toFixed(5)}).`;window.currentCalc={h,ep,hp,exact}}if(mode==='growth'){ $('v_k').textContent=val('k').toFixed(1);$('v_y0').textContent=val('y0').toFixed(1)}if(mode==='slope'){$('v_sk').textContent=val('sk').toFixed(1);$('v_sy').textContent=val('sy').toFixed(1)}if(mode==='numerical')$('v_h').textContent=val('h').toFixed(2);if(mode==='uniqueness')$('v_delay').textContent=val('delay').toFixed(2);$('chartReadout').innerHTML=description;
let left=56,right=672,top=23,bottom=316,W=right-left,H=bottom-top;const X=t=>left+t/tmax*W,Y=y=>bottom-(y-ymin)/(ymax-ymin)*H;const poly=(pts)=>pts.filter(p=>Number.isFinite(p[1])).map(p=>`${X(p[0]).toFixed(2)},${Y(p[1]).toFixed(2)}`).join(' ');let out='';for(let i=0;i<=5;i++){let y=ymin+(ymax-ymin)*i/5;out+=`<line x1="${left}" y1="${Y(y)}" x2="${right}" y2="${Y(y)}" stroke="#e4eaf5"/><text x="${left-10}" y="${Y(y)+4}" text-anchor="end" fill="#7b8ba7" font-size="12">${y.toFixed(ymax<=5?1:0)}</text>`}for(let i=0;i<=5;i++){let t=tmax*i/5;out+=`<text x="${X(t)}" y="${bottom+24}" text-anchor="middle" fill="#7b8ba7" font-size="12">${t.toFixed(1)}</text>`}out+=`<line x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}" stroke="#8595b2"/><line x1="${left}" y1="${top}" x2="${left}" y2="${bottom}" stroke="#8595b2"/><text x="${right}" y="${bottom+40}" text-anchor="end" fill="#697b96" font-size="12">t</text><text x="22" y="22" fill="#697b96" font-size="12">y(t)</text>`;series.forEach((s,i)=>{out+=`<polyline fill="none" stroke="${s.color}" stroke-width="${i===0?3:2.8}" stroke-linejoin="round" stroke-linecap="round" points="${poly(s.pts)}"/>`;if(mode==='numerical'&&i>0)out+=s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.2" fill="${s.color}"/>`).join('')});out+=series.map((s,i)=>`<g transform="translate(${left+i*174},348)"><line x1="0" y1="-4" x2="19" y2="-4" stroke="${s.color}" stroke-width="3"/><text x="25" y="0" fill="#526581" font-size="12">${s.name}</text></g>`).join('');svg.innerHTML=out;let tb=$('stepTable');if(tb)tb.innerHTML=''}
function showTable(){if(!window.currentCalc)return;const {h,ep,hp,exact}=window.currentCalc;$('stepTable').innerHTML=`<h3 style="margin:22px 0 7px">Numerical steps</h3><div style="overflow:auto"><table class="mini-table"><tr><th>t</th><th>Euler</th><th>Heun</th><th>Exact</th></tr>${ep.map((p,i)=>`<tr><td>${round(p[0],4)}</td><td>${round(p[1],5)}</td><td>${round(hp[i][1],5)}</td><td>${round(exact(p[0]),5)}</td></tr>`).join('')}</table></div>`}
function practice(){if(!quizPool.length){quizPool=questions.slice();quizIndex=0}let q=quizPool[quizIndex];return head('Practice until you understand','Try the answer first. Every question provides reasoning, and missed questions go into your review list.')+`<div class="grid"><section class="panel s8"><div class="row"><span class="pill">QUESTION ${quizIndex+1} / ${quizPool.length}</span><span class="pill">${topics[q[1]].name}</span></div><div class="progress"><span style="width:${(quizIndex+1)/quizPool.length*100}%"></span></div><div class="question">${q[2]}</div><div class="answers">${q[3].map((a,i)=>`<button class="answer ${quizAnswered?(i===q[4]?'right':i===quizSelection?'wrong':''):''}" onclick="answer(${i})" ${quizAnswered?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}</div>${quizAnswered?`<div class="explain ${quizSelection===q[4]?'good':'bad'}" style="margin-top:17px"><strong>${quizSelection===q[4]?'✓ Correct. You understood the concept.':'Not quite. Here is the reasoning.'}</strong><br>${esc(q[5])}</div><div class="btnline"><button class="btn" onclick="nextQuestion()">${quizIndex===quizPool.length-1?'Finish and restart':'Next question →'}</button></div>`:''}</section><aside class="panel s4"><h3>Choose your training</h3><button class="btn secondary" onclick="startQuiz()">Full chapter quiz</button><div style="height:12px"></div><label class="muted">Practice one topic</label><select class="input" style="max-width:100%;margin-top:8px" onchange="startQuiz(this.value)"><option value="all">Select a lesson…</option>${topics.map((t,i)=>`<option value="${i}" ${quizMode===String(i)?'selected':''}>${i+1}. ${t.name}</option>`).join('')}</select><div style="height:18px"></div><h3>Your results</h3><p>${state.correct} correct out of ${state.attempts} total attempts</p><button class="btn ghost" onclick="startQuiz('mistakes')" ${!Object.keys(state.mistakes).length?'disabled':''}>Redo missed questions (${Object.keys(state.mistakes).length})</button><div style="height:16px"></div><div class="explain">A wrong answer isn't failure. It's a precise signal about which idea to review.</div></aside></div>`}
function answer(i){if(quizAnswered)return;quizSelection=i;quizAnswered=true;state.attempts++;let q=quizPool[quizIndex];if(i===q[4]){state.correct++;delete state.mistakes[q[0]]}else state.mistakes[q[0]]=true;save();render()}
function nextQuestion(){quizIndex=(quizIndex+1)%quizPool.length;quizAnswered=false;quizSelection=null;render()}
function mistakes(){let missed=questions.filter(q=>state.mistakes[q[0]]);return head('Review your mistakes','Target the concepts you got wrong instead of rereading everything.')+`<div class="grid"><section class="panel s8"><h2>${missed.length?'Questions to revisit':'Your review list is empty'}</h2>${missed.length?missed.map(q=>`<div class="topic"><div><strong>${esc(q[2])}</strong><small>${topics[q[1]].name}</small></div><button class="btn secondary" onclick="startQuiz('mistakes')">Review</button></div>`).join(''):'<p>Once you miss a question, it will appear here. Practice a few questions to get started.</p>'}<div class="btnline"><button class="btn" onclick="startQuiz('mistakes')" ${!missed.length?'disabled':''}>Train weak spots</button><button class="btn secondary" onclick="startQuiz()">Start quiz</button></div></section><section class="panel s4"><h3>Your learning dashboard</h3><div class="metric">${percent()}%</div><p>Lessons completed</p><div class="progress"><span style="width:${percent()}%"></span></div><div class="metric">${missed.length}</div><p>Questions to revisit</p><div style="height:15px"></div><button class="btn ghost" onclick="resetProgress()">Reset local progress</button></section></div>`}
function resetProgress(){if(!confirm('Reset all locally saved lesson and quiz progress?'))return;state={done:{},mistakes:{},attempts:0,correct:0};save();render()}
function footer(){return `<div class="footer">Mike's Math Lab · Standalone offline study website · Based on the provided “Applied Mathematics — Chapter 1: Ordinary Differential Equations” notes (University of Western Macedonia).<br>Examples in the source and additional original training questions are for learning, not official exam questions. Only Chapter 1 was provided; later chapters are not claimed to be covered.</div>`}
function render(){renderNav();$('main').innerHTML=({home,lessons,lesson:lessonPage,visual,practice,mistakes}[view]||home)();if(view==='visual')renderGraph()}
render();
</script></body></html>
