let view=validViews.includes(initialParams.get('view'))?initialParams.get('view'):'home',lesson=Math.max(0,Number(initialParams.get('lesson'))||0),quizIndex=0,quizPool=[],quizAnswered=false,quizSelection=null,quizMode='all',graphMode='growth';
const topics=[
 {name:'What is an ODE?',sub:'Derivative, slope, initial condition',pages:'3–4',formula:"dy/dt = f(t, y),   y(t₀) = y₀",intro:'A differential equation gives a rule for how something changes. The unknown is a whole function, not just a number.',analogy:'Think of a GPS that tells you the speed and direction at each moment. The differential equation is the movement rule; the initial condition tells you where you started.',steps:[['Recognize the derivative','dy/dt is the instantaneous slope of y versus t. A positive slope means rising; negative means falling.'],['Read the rule','In dy/dt = 2y, the slope equals twice the current value. At y = 3, the slope is 6.'],['Use the initial condition','y(0)=3 says the curve passes through (0, 3). Without it, many curves can obey the same rule.'],['Check the solution','For y(t)=3e^(2t), the derivative is 6e^(2t)=2y(t), and y(0)=3.']],takeaway:'Derivative = rate of change. Initial value = starting point. Solution = the full curve.'},
 {name:'Separable Equations',sub:'Separate, integrate, solve, check',pages:'4–6, 9–10',formula:'dy/dx = g(x)h(y)  →  dy/h(y) = g(x) dx',intro:'Separation of variables works when the right-hand side can be written as a product of a function of x and a function of y.',analogy:'Put all the y-related pieces on the left, all the x-related pieces on the right, then integrate both sides.',steps:[['Recognize the structure','For dy/dx=2xy, write dy/y=2x dx, where y ≠ 0. Also check y=0 separately as a possible solution.'],['Integrate both sides','∫(1/y)dy = ∫2x dx  →  ln|y|=x²+C.'],['Solve for y','y=Ae^(x²). Here A is a real constant; the zero solution is included when A=0.'],['Apply an initial condition','Given y(0)=3, we get A=3, so y=3e^(x²).'],['Check validity','Differentiate your proposed solution and verify the ODE and initial value. Watch for division by zero and singularities.']],takeaway:'Separate → integrate → use the initial value → verify → find the interval.'},
 {name:'Uniqueness & Lipschitz',sub:'When can we trust one solution?',pages:'6–7',formula:'|f(t,y₁) − f(t,y₂)| ≤ L|y₁ − y₂|',intro:'Before approximating a solution, we should ask whether the initial-value problem has a locally unique solution.',analogy:'Two routes starting from exactly the same location cannot branch apart if the rate-of-change rule is well-behaved in the required sense.',steps:[['Start with the initial-value problem','We know dy/dt=f(t,y) and y(t₀)=y₀.'],['Check continuity','The standard existence-and-uniqueness theorem requires f to be continuous locally near the starting point.'],['Check Lipschitz in y','If f is locally Lipschitz with respect to y (for example, ∂f/∂y is continuous near the point), the initial-value solution is locally unique.'],['Understand the limitation','Failure of the Lipschitz test does NOT prove non-uniqueness. It only removes this particular guarantee.'],['See the counterexample','For y′=y^(1/3), y(0)=0, both y=0 and a solution that leaves zero after a delay can satisfy the same initial value.']],takeaway:'Continuity + local Lipschitz in y ⇒ local existence and uniqueness. The condition is sufficient, not necessary.'},
 {name:'Euler Method',sub:'Numerical slopes, one step at a time',pages:'7–9, 10–11',formula:'yₙ₊₁ = yₙ + h · f(tₙ,yₙ)',intro:'Euler approximates a solution by repeatedly moving along the tangent line instead of following the exact curved path.',analogy:'Take a small step in the direction of the slope, stop, measure the new slope, then take the next step.',steps:[['Write down the starting point','For y′=y−t²+1 and y(0)=0.5: t₀=0, y₀=0.5.'],['Choose the step size','Use h=0.2. The next t value is t₁=0.2.'],['Calculate the slope','f(0,0.5)=0.5−0+1=1.5.'],['Apply Euler','y₁=0.5+0.2(1.5)=0.8.'],['Repeat with the NEW point','f(0.2,0.8)=0.8−0.04+1=1.76, so y₂=0.8+0.2(1.76)=1.152.']],takeaway:'New y = old y + step size × current slope. Smaller h usually reduces error, but costs more steps.'},
 {name:'Heun Method',sub:'Predict with Euler, then correct',pages:'8–10',formula:'k₁=f(tₙ,yₙ)\ny*=yₙ+h·k₁\nk₂=f(tₙ+h,y*)\nyₙ₊₁=yₙ+(h/2)(k₁+k₂)',intro:'Heun improves Euler by averaging the slope at the beginning with a predicted slope at the end.',analogy:'Instead of estimating a car journey only from your starting speed, estimate the ending speed too and use the average.',steps:[['First slope','For y′=y−t²+1, y(0)=0.5, h=0.2: k₁=f(0,0.5)=1.5.'],['Euler prediction','y*=0.5+0.2×1.5=0.8.'],['Second slope','k₂=f(0.2,0.8)=0.8−0.04+1=1.76.'],['Average the slopes','(k₁+k₂)/2 = (1.5+1.76)/2=1.63.'],['Correct the prediction','y₁=0.5+0.2×1.63=0.826. Exact: approximately 0.8293.']],takeaway:'Euler uses one slope; Heun uses two. Both are numerical approximations.'},
 {name:'Worked Examples & Practice',sub:'Apply the full chapter to exam-style problems',pages:'5–6, 9–12',formula:'Identify → Set up → Solve → Verify',intro:'Use the same thinking process on every problem. Recognize what is being asked before choosing a formula.',analogy:'The goal is to recognize the structure, not memorize isolated calculations.',steps:[['Example A: separable','Solve y′=6xy², y(1)=1/125. Separation gives y^(-2)dy=6x dx.'],['Integrate','−1/y=3x²+C. Since y(1)=1/125, −125=3+C, so C=−128.'],['Write the explicit answer','y(x)=1/(128−3x²).'],['Find the maximal interval','The denominator vanishes at ±√(128/3), so the interval containing x=1 is (−√(128/3), √(128/3)).'],['Example B: trigonometric','For y′=x cos(x²)/y, y(0)=2, integration gives y²=sin(x²)+4; take the positive root.']],takeaway:'Always use the initial value, differentiate to verify, and check the valid interval.'}
];
const questions=[
 ['01',0,'What does dy/dt represent?',['The rate of change of y','The initial value','The numerical step size','The integral constant'],0,'It is the instantaneous slope. It tells you how fast y changes with t.'],
 ['02',0,'For y′=2y, what is the slope when y=3?',['2','3','6','9'],2,'Substitute the CURRENT value: 2×3 = 6.'],
 ['03',0,'Why do we need y(0)=3 in addition to y′=2y?',['To select one solution curve','To make t equal to 3','To change the derivative','To eliminate t'],0,'The differential rule describes a family of curves; the initial condition picks a member.'],
 ['04',1,'Is y′=x(y+1) separable?',['Yes','No','Only if x=0','Only if y=1'],0,'It factors into a function of x times a function of y. dy/(y+1)=x dx where y≠−1; separately check y=−1.'],
 ['05',1,'Solve y′=2xy with y(0)=3.',['y=3e^(x²)','y=3e^(2x)','y=2xe³','y=3+x²'],0,'Separate dy/y=2x dx; integrate ln|y|=x²+C. Initial value yields y=3e^(x²).'],
 ['06',1,'Which is the next correct step for y′=6xy²?',['y⁻² dy = 6x dx','y² dy = 6x dx','dy = 6y dx','y dy = x² dx'],0,'Divide by y² (on nonzero solutions) and multiply by dx.'],
 ['07',1,'For y=1/(128−3x²) with y(1)=1/125, which maximal interval contains x=1?',['(−√(128/3), √(128/3))','All real numbers','(1,∞)','(−∞,1)'],0,'Avoid both denominator zeros; choose the connected interval containing x=1.'],
 ['08',2,'What does the local Lipschitz condition in y help guarantee (with the other theorem assumptions)?',['Local uniqueness of the IVP solution','Every ODE has a simple formula','Euler always produces exact answers','All solutions are global'],0,'With continuity, local Lipschitz in y yields a unique local solution via Picard–Lindelöf.'],
 ['09',2,'If a function fails a Lipschitz test, what can you conclude?',['Uniqueness is not guaranteed by that test','There must be infinitely many solutions','There is never a solution','Euler is impossible to compute'],0,'A sufficient test failing does not prove that uniqueness fails.'],
 ['10',2,'Does y′=y^(1/3), y(0)=0 have a unique solution?',['No','Yes','Only for negative t','Only with Euler'],0,'There are multiple solutions, including y=0 and solutions that remain at zero before departing.'],
 ['11',3,'Euler: y′=t+y, y(0)=1, h=0.1. Find y₁.',['1.1','1.2','0.9','2'],0,'y₁=y₀+h f(0,1)=1+0.1(1)=1.1.'],
 ['12',3,'Using the previous Euler example, what is y₂?',['1.22','1.21','1.1','1.32'],0,'At t₁=0.1, y₁=1.1, slope=0.1+1.1=1.2; y₂=1.1+0.1×1.2=1.22.'],
 ['13',3,'Euler for y′=y−t²+1, y(0)=0.5, h=0.2: y₁=?',['0.8','0.826','1.5','1.152'],0,'f(0,0.5)=1.5. Add h×slope: 0.5+0.2×1.5=0.8.'],
 ['14',3,'Why might a smaller Euler step improve accuracy?',['It reduces the distance spent following a straight tangent','It makes the true curve straight','It guarantees zero error','It changes the ODE'],0,'Shorter steps reduce the approximation made by each tangent segment, under suitable conditions.'],
 ['15',4,'Heun: if k₁=1.5, k₂=1.76, y₀=0.5, h=0.2, what is y₁?',['0.826','0.8','1.63','0.852'],0,'y₁=0.5+(0.2/2)(1.5+1.76)=0.826.'],
 ['16',4,'Which method uses a predicted endpoint slope?',['Heun','Basic Euler','Separation only','The initial condition'],0,'Heun predicts a point with Euler, computes another slope there, and averages.'],
 ['17',4,'In the chapter example at t=0.2, which is closest to the exact value 0.8293?',['Heun: 0.826','Euler: 0.8','Both equal','Neither can be compared'],0,'Heun error ≈0.0033 versus Euler error ≈0.0293.'],
 ['18',5,'For y′=6xy², y(1)=1/125, find the integration constant in −1/y=3x²+C.',['−128','128','−125','3'],0,'At x=1, −1/y=−125, so −125=3+C and C=−128.'],
 ['19',5,'For y′=x cos(x²)/y, y(0)=2, what is y(x)?',['√(4+sin(x²))','4+sin(x)','√(2+cos(x²))','−√(4+sin(x²))'],0,'Integrate y dy=x cos(x²)dx; get y²=4+sin(x²). y(0)=2 chooses the positive branch.'],

// The following vault covers each heading, worked example and practice exercise in the 12-page source.
const vaultSections=[
{title:'Chapter introduction & 1.1 · First-order ODEs',pages:'3–4',html:`
<p>An <b>ordinary differential equation (ODE)</b> contains derivatives of an unknown function. Unlike an algebra equation, its answer is an entire function y(t), not one number. ODEs can model coffee cooling, bacterial populations, speed, or financial prices: each describes change over time.</p>
<div class="vault-math">dy/dt = f(t, y),    t ∈ [a,b],    y(t₀) = y₀</div>
<ul><li><b>t:</b> independent variable, often time.</li><li><b>y(t):</b> unknown curve/function.</li><li><b>f(t,y):</b> known rule giving the slope at the current point.</li><li><b>y(t₀)=y₀:</b> initial condition, selecting the curve and its starting point.</li></ul>
<p><b>Why slope rather than solution?</b> A GPS showing current speed and direction tells you how you are moving but not the entire future route. Solving the ODE reconstructs that route from the slope rule. The initial condition is essential: the same motion rule can begin at different positions.</p>
<div class="vault-callout"><b>Say it in your own words:</b> What is the difference between a rate-of-change rule and the actual function?</div>`},
{title:'1.2 · Separable equations, implicit and explicit solutions',pages:'4–5',html:`
<p>Separable means you can move every y-term to one side and every x-term to the other. This works for equations of the form y′=g(x)h(y), provided division by h(y) is valid. Always check separately if h(y)=0 gives a constant solution.</p>
<div class="vault-math">N(y) dy/dx = M(x)
N(y) dy = M(x) dx
∫N(y)dy = ∫M(x)dx</div>
<p>Separation looks like treating dy/dx as a fraction, but its rigorous justification comes from the chain rule and substitution in integrals, not from dy/dx literally being an ordinary fraction.</p>
<ul><li><b>Implicit solution:</b> a relationship between x and y, e.g. −1/y = 3x²+C.</li><li><b>Explicit solution:</b> y isolated as y(x), e.g. y=1/(128−3x²).</li><li><b>Maximal validity interval:</b> a connected interval containing the initial x-value, avoiding zero denominators, invalid logarithms or square roots, and places the solution/ODE ceases to make sense.</li></ul>
<div class="vault-math">5-step solve checklist:
① Separate x and y
② Integrate BOTH sides (+C)
③ Apply the initial condition
④ Isolate y, if possible
⑤ Verify the ODE and maximal interval</div>`},
{title:'Example 1.1 · Nonlinear separable ODE & validity interval',pages:'5–6',html:`
<p><b>From the PDF:</b> Solve y′=6xy² with y(1)=1/125 and determine its maximal validity interval.</p>
<div class="vault-math">dy/dx = 6xy²
 y⁻² dy = 6x dx
 ∫y⁻²dy = ∫6x dx
 −1/y = 3x² + C
 x=1, y=1/125 ⇒ −125 = 3 + C ⇒ C = −128
 −1/y = 3x²−128
 y(x) = 1/(128−3x²)</div>
<p>The denominator is zero when x=±√(128/3)≈±6.532. The maximal interval containing x=1 is <b>(−√(128/3), √(128/3))</b>.</p>
<div class="vault-callout"><b>Precision note:</b> The PDF rounds the endpoints to ±6.527; calculating √(128/3) gives about ±6.532. The exact radical expression is the correct one.</div>
<p>Verification: y′=6x/(128−3x²)²=6xy², and y(1)=1/125. The zero solution exists too, but cannot meet the specified initial condition.</p>`},
{title:'Example 1.2 · Exponential growth and decay',pages:'6',html:`
<p>When the rate of change is proportional to what already exists, y′=ky. It models population growth, radioactive decay, compound-interest-type continuous growth, or cooling under a simplified model.</p>
<div class="vault-math">dy/dx = ky
 dy/y = k dx  (for y ≠ 0)
 ln|y| = kx+C
 y(x) = A e^(kx)  (A may be 0)</div>
<ul><li>k&gt;0: increasing exponential when A&gt;0 (growth).</li><li>k&lt;0: decreasing toward zero when A&gt;0 (decay).</li><li>k=0: constant function.</li><li>The initial condition determines A: y(0)=A.</li></ul>
<p>In the Visual Lab, change k from positive to negative to see the curves shift between growth and decay.</p>`},
{title:'1.3 · Lipschitz & Picard–Lindelöf uniqueness',pages:'6–7',html:`
<p>Before trusting an approximation, ask whether an initial-value problem has a well-defined solution. If <b>f(t,y) is continuous near (t₀,y₀)</b> and <b>locally Lipschitz in y</b>, the Picard–Lindelöf theorem guarantees a <b>unique local solution</b>.</p>
<div class="vault-math">|f(t,y₁) − f(t,y₂)| ≤ L |y₁ − y₂|
where L &gt; 0 is a local bound</div>
<p>Interpretation: changing y a little cannot change the slope disproportionately fast. A practical sufficient check is that ∂f/∂y is continuous (hence bounded on a small compact neighborhood). These are local conditions.</p>
<p><b>Counterexample from the PDF:</b> y′=y^(1/3), y(0)=0. The constant y(t)=0 is a solution, but so is the piecewise solution y(t)=0 for t≤a and y(t)=[(2/3)(t−a)]^(3/2) for t&gt;a, for any a≥0. Same starting condition, multiple solutions.</p>
<div class="vault-callout"><b>Important distinction:</b> Failure of the Lipschitz test alone does not mean uniqueness is impossible. It means this sufficient theorem cannot guarantee it. A numerical algorithm can still print numbers without detecting nonuniqueness.</div>
<p><b>Analogy:</b> Check the road for sharp cliffs before trying to follow its slope in small steps.</p>`},
{title:'1.4 · Why numerical methods? Euler formula & geometry',pages:'7–8',html:`
<p>Most real ODEs do not have an easy closed-form solution. Numerical methods compute approximate values at selected time points rather than a symbolic expression for the entire function.</p>
<div class="vault-math">Interval [a,b], N equal steps
h = (b−a)/N,    tₙ = a+n h
 y′(tₙ) = lim(h→0) [y(tₙ+h)−y(tₙ)]/h
 Euler: yₙ₊₁ = yₙ + h f(tₙ,yₙ)
 tₙ₊₁ = tₙ+h</div>
<ol><li>Start at t₀ and the known y₀.</li><li>Select the step size h.</li><li>Calculate the slope f(tₙ,yₙ).</li><li>Move along the tangent by h to get yₙ₊₁.</li><li>Repeat until the endpoint.</li></ol>
<p><b>Hill/walking analogy:</b> Move along the current tangent as if it were a straight path. At each new point, find the new slope and adjust direction. Smaller steps follow curved paths more closely but require more calculations.</p>
<p><b>Why error?</b> The true solution bends while the tangent is straight. For a smooth problem, Euler has global error O(h) over a fixed interval. Large h can cause numerical instability even if the true solution is stable; smaller h is generally better but not an unconditional accuracy guarantee.</p>`},
{title:'Euler demonstration · All 5 steps (Example 1.4)',pages:'8–10',html:`
<p><b>Source problem:</b> y′=y−t²+1, y(0)=0.5, h=0.2, t∈[0,1].</p>
<div class="vault-math">t₀=0.0, y₀=0.5, f₀=1.5      ⇒ y₁=0.8
 t₁=0.2, y₁=0.8, f₁=1.76    ⇒ y₂=1.152
 t₂=0.4, y₂=1.152, f₂=1.992 ⇒ y₃=1.5504
 t₃=0.6, y₃=1.5504, f₃=2.1904 ⇒ y₄=1.98848
 t₄=0.8, y₄=1.98848, f₄=2.34848 ⇒ y₅=2.458176</div>
<p><b>Euler estimate:</b> y(1)≈2.458176. The exact solution is y(t)=(t+1)²−0.5eᵗ, so y(1)=4−e/2≈2.64086, <b>not 2.4366</b>.</p>
<div class="vault-callout"><b>Verified correction to the supplied PDF:</b> The handout's stated exact value at t=1 (≈2.4366) conflicts with its own exact formula. The correct exact value is ≈2.64086. Euler's absolute error at t=1 is ≈0.18268.</div>
<p>Open <b>Visual Lab → Euler vs Heun</b> and change h to see the complete numerical table and the graph.</p>`},
{title:'1.4 · Heun: predictor–corrector method',pages:'9',html:`
<p>Euler uses the slope only at the start. <b>Heun</b> predicts an endpoint with Euler, evaluates a second slope there, and averages both slopes. Think of estimating the distance driven using the average of the start and estimated end velocities.</p>
<div class="vault-math">k₁ = f(tₙ,yₙ)
 y* = yₙ+h k₁       ← Euler prediction
 k₂ = f(tₙ+h,y*)
 yₙ₊₁ = yₙ+(h/2)(k₁+k₂)</div>
<p>Heun is an explicit second-order Runge–Kutta method: for sufficiently smooth equations, its global error is O(h²) over a fixed interval, versus O(h) for Euler. It requires two slope evaluations per step and is often more accurate, but is not unconditionally stable.</p>
<p><b>Why look ahead?</b> The predictor senses how the slope may change by the end; the corrector partially compensates for curvature.</p>`},
{title:'Example 1.5 · One complete Heun step',pages:'10',html:`
<p>Same ODE: y′=y−t²+1, y(0)=0.5, h=0.2.</p>
<div class="vault-math">k₁ = f(0,0.5)=1.5
 y* = 0.5+0.2(1.5)=0.8
 k₂ = f(0.2,0.8)=0.8−0.04+1=1.76
 y₁ = 0.5+(0.2/2)(1.5+1.76)
 y₁ = 0.826</div>
<p>Compare at t=0.2: Euler=0.8, Heun=0.826, exact y(0.2)=1.44−0.5e^0.2≈0.82930. Heun is closer in this example.</p>`},
{title:'Example 1.3 · Trigonometric separable equation',pages:'9',html:`
<p>Solve y′=x cos(x²)/y with y(0)=2.</p>
<div class="vault-math">y dy = x cos(x²) dx
 ∫y dy = ∫x cos(x²) dx
 y²/2 = sin(x²)/2+C
 y² = sin(x²)+2C
 y(0)=2 ⇒ 4=0+2C ⇒ C=2
 y(x) = √[4+sin(x²)]</div>
<p>Use substitution u=x², du=2x dx. Take the positive square-root branch because y(0)=2. Since −1≤sin(x²)≤1, 4+sin(x²)≥3, and the solution is valid for every real x.</p>`},
{title:'1.6 · Exercise 1.1: separation',pages:'11',html:`
<p><b>Try it:</b> Solve y′=2xy, y(0)=3. Find the explicit solution.</p>
<div class="vault-math">dy/y=2x dx
 ln|y|=x²+C
 y=Ae^(x²)
 y(0)=3 ⇒ A=3
 ANSWER: y(x)=3e^(x²)</div>
<p>Differentiate to check: y′=6xe^(x²)=2xy.</p>`},
{title:'1.6 · Exercise 1.2: 2 Euler steps',pages:'11',html:`
<p><b>Try it:</b> y′=t+y, y(0)=1, h=0.1. Compute y₁ and y₂.</p>
<div class="vault-math">f(0,1)=1     ⇒ y₁=1+0.1(1)=1.1
 f(0.1,1.1)=1.2 ⇒ y₂=1.1+0.1(1.2)=1.22</div>
<p><b>Answer:</b> y₁=1.1, y₂=1.22. Use the updated t and y values for the second step.</p>`},
{title:'1.6 · Exercise 1.3: why Lipschitz matters',pages:'11',html:`
<p><b>Try it:</b> Explain in your own words why uniqueness matters before applying a numerical method. What might go wrong without the condition?</p>
<p><b>Suggested answer:</b> If an initial-value problem does not have a unique solution, an algorithm can still output one trajectory even though multiple true trajectories start from the same point. We cannot assume that the numerical curve represents a uniquely determined solution. Lipschitz (together with continuity and the local hypotheses) is a sufficient way to guarantee local uniqueness.</p>
<div class="vault-callout">A failed Lipschitz check ≠ proof of multiple solutions. Some equations remain uniquely solvable by other arguments.</div>`},
{title:'1.6 · Exercise 1.4: identify separable ODEs',pages:'11–12',html:`
<p>Classify each as separable or not.</p>
<div class="vault-math">(a) y′ = xy+x = x(y+1)  ⇒ separable
     dy/(y+1)=x dx (when y≠−1)
     y=−1 is also a constant solution.

(b) y′ = x+y          ⇒ not separable
     The sum x+y cannot generally be factored as g(x)h(y).

(c) y′ = y/x          ⇒ separable (x≠0)
     dy/y=dx/x (when y≠0)
     y=0 also solves the ODE on intervals away from x=0.</div>
<p>Not separable does not mean unsolvable: for example, (b) is a first-order linear ODE.</p>`},
{title:'Chapter 1 summary · Exam-ready checklist',pages:'12',html:`
<ul><li>A first-order ODE gives a slope rule dy/dt=f(t,y); the initial condition selects a starting point.</li><li>For a separable ODE, isolate y and x, integrate each side, determine the constant, and check domain and possible lost equilibrium solutions.</li><li>Continuity and local Lipschitz in y guarantee a unique local IVP solution; Lipschitz is sufficient, not necessary.</li><li>When an analytical formula is unavailable, use numerical values: Euler uses one tangent slope, Heun averages two slopes.</li><li>Euler is usually first-order accurate globally; Heun is usually second-order under smoothness assumptions.</li><li>Always verify units, step count, the initial condition, and whether your answer is exact or approximate.</li></ul>
<div class="vault-callout">Everything from the PDF's table of contents, explanations, five numbered worked examples, four practice exercises and chapter summary is represented in this course vault, in English. The two inconsistent numerical values in the PDF are explicitly corrected rather than repeated.</div>`}
];
